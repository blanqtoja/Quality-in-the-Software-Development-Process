[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    aleksander: REST API tests assigned to Aleksander Kazmierczak (Person 1)
    lukasz: REST API tests assigned to Lukasz Murza (Person 2)
    happy_path: Positive test cases (Happy Path)
    negative_path: Negative test cases (Negative Path / error handling)
    get_method: Tests verifying HTTP GET endpoints
    post_method: Tests verifying HTTP POST endpoints
